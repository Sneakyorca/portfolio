<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdulmaleek Odetunde — Frontend Developer</title>
    <meta
      name="description"
      content="Booking websites and business sites for salons, studios and small businesses in Nigeria and the UK. Bookings straight to you, no platform fees. Built by Abdulmaleek Odetunde."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      content="#f7f4ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101319"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews (LinkedIn, X, WhatsApp, Slack) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Abdulmaleek Odetunde — Frontend Developer"
    />
    <meta
      property="og:description"
      content="Booking websites and business sites for small businesses. Bookings straight to you, no platform fees."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@sneakyorca" />

    <!-- Apply the saved/system theme before first paint to avoid a light flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="root"
      class="font-body bg-background dark:bg-background transition-colors duration-500 text-body"
    ></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
